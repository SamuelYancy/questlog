name: Questlog
options:
  bundleIdPrefix: com.samuelyancy
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Questlog:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Questlog
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Questlog/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelyancy.questlog
        PRODUCT_NAME: Questlog
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  QuestlogTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: QuestlogTests
    dependencies:
      - target: Questlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelyancy.questlog.tests
        GENERATE_INFOPLIST_FILE: YES

  QuestlogUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: QuestlogUITests
    dependencies:
      - target: Questlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelyancy.questlog.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Questlog:
    build:
      targets:
        Questlog: all
        QuestlogTests: [test]
        QuestlogUITests: [test]
    test:
      targets:
        - QuestlogTests
        - QuestlogUITests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
